theorem Metrics.query_chart : ∀ (p : Metrics.GapPolicy) (s : Metrics.Scrapes) (x₀ x₁ : Metrics.Time) {k : Nat} (hk : k < (Inkproof.Core.SegmentedPyramid.query (Metrics.chart p s) x₀ x₁).size), have q := (Inkproof.Core.SegmentedPyramid.query (Metrics.chart p s) x₀ x₁)[k]; have w := (Metrics.inWindow (Metrics.chart p s) k x₀ x₁).toList; q.fst.get = List.findSome? (fun x => x.snd) w ∧ q.snd.snd.snd.get = List.findSome? (fun x => x.snd) w.reverse ∧ (∀ (a : Metrics.Reading), q.snd.fst.get = Option.some a ↔ (∃ x, x ∈ w ∧ x.snd = Option.some a) ∧ ∀ (x : Metrics.Time × Option Metrics.Reading), x ∈ w → ∀ (b : Metrics.Reading), x.snd = Option.some b → b ≤ a) ∧ (∀ (a : Metrics.Reading), q.snd.snd.fst.get = Option.some a ↔ (∃ x, x ∈ w ∧ x.snd = Option.some a) ∧ ∀ (x : Metrics.Time × Option Metrics.Reading), x ∈ w → ∀ (b : Metrics.Reading), x.snd = Option.some b → a ≤ b) ∧ (q.snd.fst.get = Option.none ↔ ∀ (x : Metrics.Time × Option Metrics.Reading), x ∈ w → x.snd = Option.none)
theorem Metrics.query_eq : ∀ (ch : Metrics.Chart) (x₀ x₁ : Metrics.Time) {k : Nat} (hk : k < (Inkproof.Core.SegmentedPyramid.query ch x₀ x₁).size), (Inkproof.Core.SegmentedPyramid.query ch x₀ x₁)[k] = Inkproof.Core.Aggregate.fold ch.measure (Metrics.inWindow ch k x₀ x₁)
def Metrics.summarise : Metrics.Time × Option Metrics.Reading → Metrics.Summary
